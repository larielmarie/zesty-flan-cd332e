<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 65" width="80" height="65">
  <!-- === DESK SURFACE (L-shaped top view in perspective) === -->
  <!-- Left section of desktop -->
  <polygon points="4,34 20,44 48,33 32,23" fill="#8B3A3A"/>
  <!-- Right section of desktop (shorter arm of L) -->
  <polygon points="32,23 48,33 76,22 60,12" fill="#9B4444"/>

  <!-- === FRONT FACES === -->
  <!-- Left front face -->
  <polygon points="4,34 4,40 20,50 20,44" fill="#6B2A2A"/>
  <!-- Right front face -->
  <polygon points="60,12 60,18 76,28 76,22" fill="#6B2A2A"/>

  <!-- === SIDE/BACK PANELS === -->
  <!-- Left side bottom panel -->
  <polygon points="20,44 20,50 48,39 48,33" fill="#7A3333"/>
  <!-- Inner corner panel between the two desk arms -->
  <polygon points="48,33 48,39 76,28 76,22" fill="#7A3333"/>

  <!-- === LEGS === -->
  <rect x="5" y="40" width="4" height="8" rx="1" fill="#5A2020"/>
  <rect x="72" y="28" width="4" height="8" rx="1" fill="#5A2020"/>
  <rect x="17" y="47" width="3" height="7" rx="1" fill="#5A2020"/>

  <!-- === MONITOR === -->
  <ellipse cx="22" cy="28" rx="5" ry="2" fill="#C4A0A0"/>
  <rect x="21" y="19" width="2" height="9" rx="1" fill="#B08080"/>
  <rect x="13" y="9" width="18" height="13" rx="2" fill="#5A1F1F"/>
  <rect x="14.5" y="10" width="15" height="10" rx="1" fill="#D4AAAA"/>
  <rect x="13" y="9" width="18" height="2" rx="1" fill="#7A3030"/>

  <!-- === KEYBOARD === -->
  <rect x="34" y="29" width="12" height="3.5" rx="1.5" transform="rotate(-15,40,30)" fill="#C4A0A0"/>
</svg>
